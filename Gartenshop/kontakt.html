<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt | Schuidl Shop</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="print-bed-bg"></div>
    <header>
        <div class="logo"><a href="index.html" style="color:inherit; text-decoration:none;">Schuidl<span style="color: var(--accent-orange);">.</span></a></div>
        <nav>
            <a href="index.html#shop">Shop</a>
            <a href="index.html#custom">Custom</a>
        </nav>
    </header>

    <main style="padding: 4rem 5%; max-width: 800px; margin: 0 auto; min-height: 60vh;">
        <h1 style="margin-bottom: 2rem; font-size: 2.5rem; text-align: center;">Kontakt</h1>
        <div style="background: var(--card-bg); padding: 3rem; border-radius: 12px; border: 1px solid var(--border-color);">
            <p style="color: var(--text-muted); margin-bottom: 2.5rem; text-align: center;">Hast du eine Frage zu unseren 3D-gedruckten Schildern oder möchtest du eine individuelle Sonderanfertigung? Schreib uns gerne eine Nachricht!</p>
            
            <form id="contact-form">
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="name" style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted);">Dein Name</label>
                    <input type="text" id="name" style="width: 100%; padding: 1rem; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; transition: border-color 0.3s;" required>
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="email" style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted);">Deine E-Mail-Adresse</label>
                    <input type="email" id="email" style="width: 100%; padding: 1rem; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; transition: border-color 0.3s;" required>
                </div>
                <div class="form-group" style="margin-bottom: 2rem;">
                    <label for="message" style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted);">Deine Nachricht</label>
                    <textarea id="message" rows="5" style="width: 100%; padding: 1rem; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; font-family: inherit; resize: vertical; transition: border-color 0.3s;" required></textarea>
                </div>
                <button type="button" class="btn btn-primary" style="width: 100%;" onclick="alert('Das Formular ist derzeit im Demo-Modus. Bitte sende uns eine E-Mail direkt an die im Impressum hinterlegte Adresse.')">Nachricht senden</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-brand">
                <p style="font-size: 1.2rem; font-weight: 800; margin-bottom: 0.5rem; letter-spacing: -0.5px;">Schuidl<span style="color: var(--accent-orange);">.</span></p>
                <div style="color: var(--text-muted); font-size: 0.9rem; line-height: 1.5;">
                    <p><strong>Christian Dorn</strong></p>
                    <p>Klessing 10</p>
                    <p>94571 Schaufling</p>
                </div>
            </div>
            <div class="footer-links">
                <a href="impressum.html">Impressum</a>
                <a href="datenschutz.html">Datenschutz</a>
                <a href="kontakt.html">Kontakt</a>
            </div>
        </div>
    </footer>
</body>
</html>
